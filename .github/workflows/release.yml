# Release flow: tag main.
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# The tag must match package.json's version — the workflow verifies and then
# publishes to the public npm registry through npm Trusted Publishing (GitHub
# OIDC, provenance attached, no stored token).
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Publish to npm
        run: npm publish --access public --provenance
